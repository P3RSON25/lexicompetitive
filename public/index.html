<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lexicompetitive</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>LEXICOMPETITIVE</h1>
        <p>PVP WORD BATTLE</p>
        <a class="rules-link" href="/rules.html">RULES</a>
      </header>

      <section id="lobby" class="panel lobby-grid">
        <form id="create-form" class="lobby-card">
          <h2>CREATE</h2>
          <label class="sr-only" for="create-name">Name</label>
          <input id="create-name" maxlength="20" required placeholder="NAME" />
          <button type="submit">CREATE</button>
        </form>

        <form id="join-form" class="lobby-card">
          <h2>JOIN</h2>
          <label class="sr-only" for="join-name">Name</label>
          <input id="join-name" maxlength="20" required placeholder="NAME" />
          <label class="sr-only" for="join-code">Room code</label>
          <input id="join-code" maxlength="5" required placeholder="ROOM CODE" />
          <button type="submit" class="secondary">JOIN</button>
        </form>
      </section>

      <section id="room" class="game-shell" hidden>
        <header class="game-topbar">
          <div class="wordmark">LEXI</div>
          <div class="room-readout" aria-label="Room status">
            <strong id="room-code">-----</strong>
            <span id="room-status">LOBBY</span>
          </div>
          <div class="room-actions">
            <button id="start-button" type="button">START</button>
            <button id="leave-button" type="button" class="secondary">EXIT</button>
          </div>
        </header>

        <div class="game-layout">
          <aside class="left-rail">
            <div class="target-card">
              <span class="section-label">TARGET</span>
              <div id="target-buttons" class="target-buttons" role="group" aria-label="Targeting mode">
                <button type="button" data-target="ko" class="target-button selected">
                  <strong>KO</strong><span class="sr-only">Most locked</span>
                </button>
                <button type="button" data-target="equal" class="target-button">
                  <strong>EQUAL</strong><span class="sr-only">Least locked</span>
                </button>
                <button type="button" data-target="random" class="target-button">
                  <strong>RANDOM</strong><span class="sr-only">Random living opponent</span>
                </button>
              </div>
            </div>
          </aside>

          <section class="arena">
            <div class="arena-heading">
              <h2 id="arena-state">WAITING</h2>
              <div id="opponents" class="opponents" aria-label="Opponents"></div>
            </div>

            <div class="board-zone">
              <div class="pending-meter" aria-label="Pending garbage">
                <span class="meter-label">PENDING</span>
                <strong id="pending-count">0</strong>
                <div class="pending-track"><div id="pending-fill" class="pending-fill"></div></div>
                <span id="pending-timer">CLEAR</span>
              </div>

              <div class="board-frame">
                <div id="board" class="tetris-board" role="img" aria-label="Your health board"></div>
                <div class="board-overlay">
                  <div class="health-readout">
                    <strong><span id="locked-lines">0</span><small>/20</small></strong>
                    <span id="health-percent">100%</span>
                  </div>
                  <div class="input-deck">
                    <div class="fragments" id="fragments"></div>
                    <form id="word-form" class="word-form">
                      <label class="sr-only" for="word-input">Word</label>
                      <input id="word-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="WORD" disabled />
                      <button type="submit" disabled>SEND</button>
                    </form>
                  </div>
                </div>
              </div>

              <div class="combo-meter" aria-label="Your combo">
                <span class="meter-label">COMBO</span>
                <strong id="combo">0</strong>
                <div class="kill-readout">
                  <strong id="kills">0</strong>
                  <span>KILLS</span>
                </div>
              </div>
            </div>

            <p id="status" class="status" aria-live="polite">READY</p>
            <div id="event-log" class="event-log" aria-live="polite"></div>
          </section>

          <aside class="players-card">
            <div class="players-heading">
              <strong id="player-count">0</strong>
              <span class="sr-only">Players</span>
            </div>
            <div id="players"></div>
            <div class="personal-stats">
              <div class="personal-stat"><strong id="lines-sent">0</strong><span>SENT</span></div>
              <div class="personal-stat"><strong id="words-played">0</strong><span>WORDS</span></div>
            </div>
          </aside>
        </div>

        <div id="round-result" class="round-result" hidden>
          <div class="round-result-card">
            <span class="meter-label">ROUND</span>
            <h2 id="round-result-title">WIN</h2>
            <div class="round-wpm"><strong id="round-result-wpm">0</strong><span>WPM</span></div>
            <button id="round-start-button" type="button" hidden>START AGAIN</button>
          </div>
        </div>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
